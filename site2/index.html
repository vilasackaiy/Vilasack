<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIY Web Demo</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Segoe UI,sans-serif;background:#0f172a;color:#e2e8f0}
    .wrap{max-width:900px;margin:auto;padding:70px 24px}.card{background:#172033;border:1px solid #334155;border-radius:24px;padding:36px;box-shadow:0 20px 60px #0005}
    h1{font-size:38px;margin:0 0 10px}.muted{color:#94a3b8}.btn{border:0;border-radius:12px;padding:13px 18px;background:#38bdf8;color:#082f49;font-weight:800;cursor:pointer}
    pre{background:#020617;padding:18px;border-radius:14px;overflow:auto;margin-top:22px}
  </style>
</head>
<body><main class="wrap"><section class="card">
  <p class="muted">Website 02 • Nginx + Node-RED</p>
  <h1>API Demo</h1>
  <p class="muted">Trang này dùng domain demo.localhost và gọi API Node-RED qua Nginx.</p>
  <button class="btn" id="test">Gọi API</button><pre id="out">Chưa gọi API.</pre>
</section></main>
<script>
document.getElementById('test').onclick=async()=>{const r=await fetch('/api/tacke?amount=120000');const data=await r.json();document.getElementById('out').textContent=JSON.stringify(data,null,2)};
</script></body></html>
