services:
  nginx:
    image: nginx:alpine
    container_name: aiy-nginx
    ports:
      - "8088:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./style.css:/usr/share/nginx/html/style.css:ro
      - ./app.js:/usr/share/nginx/html/app.js:ro
      - ./site2:/usr/share/nginx/html/site2:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - nodered

  nodered:
    image: nodered/node-red:latest
    container_name: aiy-nodered
    ports:
      - "1881:1880"
    volumes:
      - nodered_data:/data
      - ./nodered/flows.json:/data/flows.json:ro

  mariadb:
    image: mariadb:11
    container_name: aiy-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root123
      MARIADB_DATABASE: aiy_food
      MARIADB_USER: aiy
      MARIADB_PASSWORD: aiy123
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: aiy-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
    ports:
      - "8090:80"
    depends_on:
      - mariadb

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: aiy-cloudflared
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TUNNEL_TOKEN}
    depends_on:
      - nginx

volumes:
  nodered_data:
  mariadb_data:



